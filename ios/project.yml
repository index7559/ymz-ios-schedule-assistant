name: ScheduleApp
options:
  bundleIdPrefix: com.ymz
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.24.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "语音输入需要麦克风权限"
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "语音识别需要权限"

targets:
  ScheduleApp:
    type: application
    platform: iOS
    sources:
      - path: ScheduleApp/Sources
      - path: ScheduleApp/Resources
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ymz.scheduleapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "语音输入需要麦克风权限"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "语音识别需要权限"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
